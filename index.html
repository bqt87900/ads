<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f3ec">
  <meta name="description" content="寂寞 · 忘情水，常用入口。">
  <title>寂寞 · 忘情水</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f3ec;
      --ink: #172421;
      --muted: #697670;
      --line: #dce1d8;
      --accent: #bd553d;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
      --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px 24px;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(0deg, transparent 0 39px, rgb(23 36 33 / 3%) 40px);
      color: var(--ink);
      font-family: var(--sans);
    }

    .page-shell {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .masthead-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .masthead-mark::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .cover {
      position: relative;
      display: flex;
      min-height: 300px;
      align-items: flex-end;
      overflow: hidden;
      background: #355a58;
      color: #fff;
    }

    .cover img,
    .cover::after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .cover img {
      object-fit: cover;
      object-position: center 54%;
    }

    .cover::after {
      background: linear-gradient(0deg, rgb(12 27 25 / 76%), rgb(12 27 25 / 4%) 82%);
      content: "";
    }

    .cover-content {
      position: relative;
      z-index: 1;
      padding: 30px clamp(22px, 6vw, 48px) 34px;
    }

    .cover-kicker {
      margin: 0 0 12px;
      color: #e5c4a4;
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 48px;
      font-weight: 500;
      line-height: 1.2;
    }

    .cover-note {
      margin: 12px 0 0;
      color: rgb(255 255 255 / 82%);
      font-size: 13px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 32px 0 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 500;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .link-item {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      background: rgb(255 255 255 / 62%);
      color: var(--ink);
      text-decoration: none;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .link-item[aria-disabled="true"] {
      color: #728078;
      cursor: not-allowed;
    }

    .link-item:not([aria-disabled="true"]):hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #fff;
    }

    .link-name {
      font-size: 15px;
    }

    .link-state {
      color: var(--muted);
      font-size: 11px;
    }

    .link-arrow {
      color: var(--accent);
      font-size: 18px;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 2px solid var(--accent);
      background: rgb(255 255 255 / 48%);
      color: #485650;
      font-size: 13px;
      line-height: 1.7;
    }

    .notice-mark {
      flex: 0 0 auto;
      color: var(--accent);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.4;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 14px 18px;
      }

      .cover {
        min-height: 260px;
      }

      h1 {
        font-size: 34px;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .link-item {
        min-height: 64px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="masthead" aria-label="页面分类">
      <span class="masthead-mark">Personal links</span>
      <span>NO. 01 — 04</span>
    </div>

    <section class="cover" aria-labelledby="page-title">
      <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&amp;fit=crop&amp;w=1600&amp;q=85" alt="海面波浪" fetchpriority="high">
      <div class="cover-content">
        <p class="cover-kicker">寂寞 · 忘情水</p>
        <h1 id="page-title">留一个入口，<br>去往想去的地方。</h1>
        <p class="cover-note">四个常用链接，安静收在这里。</p>
      </div>
    </section>

    <section aria-labelledby="links-title">
      <div class="section-heading">
        <h2 id="links-title">常用入口</h2>
        <span>QUICK LINKS</span>
      </div>
      <ol class="links">
        <li><a class="link-item" data-link-index="0"href=""><span class="link-name">偷拍换妻</span><span class="link-state">点击进入</span><span class="link-arrow" aria-hidden="true">↗</span></a></li>
        <li><a class="link-item" data-link-index="1"href=""><span class="link-name">双飞少妇</span><span class="link-state">点击进入</span><span class="link-arrow" aria-hidden="true">↗</span></a></li>
        <li><a class="link-item" data-link-index="2"href=""><span class="link-name">情侣偷拍</span><span class="link-state">点击进入</span><span class="link-arrow" aria-hidden="true">↗</span></a></li>
        <li><a class="link-item" data-link-index="3"href=""><span class="link-name">激情乱伦</span><span class="link-state">点击进入</span><span class="link-arrow" aria-hidden="true">↗</span></a></li>
      </ol>
    </section>

    <aside class="notice" aria-label="扫码提示">
      <span class="notice-mark" aria-hidden="true">注</span>
      <span>微信内扫码无法打开时，请使用手机浏览器重新扫码。</span>
    </aside>

    <footer>
      <span>寂寞 · 忘情水</span>
      <span>留一刻给自己</span>
    </footer>
  </main>

  <script>
    const destinations = ["", "", "", ""];

    document.querySelectorAll("[data-link-index]").forEach((link) => {
      const destination = destinations[Number(link.dataset.linkIndex)]?.trim();
      if (!destination) return;

      try {
        const url = new URL(destination, window.location.href);
        if (url.protocol !== "https:" && url.protocol !== "http:") return;

        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.removeAttribute("aria-disabled");
        link.removeAttribute("tabindex");
        link.querySelector(".link-state").hidden = true;
      } catch {
        return;
      }
    });
  </script>
</body>
</html>
